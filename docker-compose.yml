services:
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_SECRET=supersecretkeyforforensictranscriptanalyst12345
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  crawl4ai:
    image: unclecode/crawl4ai:latest
    container_name: crawl4ai
    restart: unless-stopped
    shm_size: '1gb'
    ports:
      - "11235:11235"
    volumes:
      - ./crawl4ai:/app/data
    environment:
      - CRAWL4AI_API_KEY=
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
